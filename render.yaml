services:
  - type: web
    name: hungtvb-vote-system
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.railway
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        value: vote-system
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.ballotbox.io.vn
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAME_SITE
        value: Lax
      - key: REDIS_HEALTH_ENABLED
        value: "true"
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC

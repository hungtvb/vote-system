L)</label><input class="brutalist-input w-full font-body-md text-body-md text-primary" placeholder="user@domain.gov" type="email" value="citizen@vote.sys"/></div><div class="space-y-1 relative"><label class="font-label-caps text-label-caps text-on-surface block">AUTHORIZATION KEY</label><input class="brutalist-input w-full font-body-md text-body-md text-primary" placeholder="••••••••" type="password" value="wrongpassword"/><div class="mt-2 flex items-center gap-2 text-error"><span class="material-symbols-outlined text-sm" data-icon="error">error</span><span class="font-label-mono text-label-mono text-sm">AUTHORIZATION DENIED</span></div></div><div class="pt-4"><button class="brutalist-button w-full bg-primary text-on-primary border-2 border-primary py-3 font-label-caps text-label-caps text-center" type="button">VERIFY CREDENTIALS</button></div><div class="text-center pt-4"><a class="font-label-caps text-label-caps text-surface-tint hover:text-primary underline underline-offset-4 decoration-2" href="#">Request Key Reset</a></div></form><form class="space-y-6 hidden" id="form-register"><div class="space-y-1"><label class="font-label-caps text-label-caps text-on-surface block">NEW IDENTIFICATION</label><input class="brutalist-input w-full font-body-md text-body-md text-primary" placeholder="user@domain.gov" type="email"/></div><div class="space-y-1"><label class="font-label-caps text-label-caps text-on-surface block">PROPOSED KEY</label><input class="brutalist-input w-full font-body-md text-body-md text-primary" placeholder="••••••••" type="password"/></div><div class="space-y-1"><label class="font-label-caps text-label-caps text-on-surface block">CONFIRM KEY</label><input class="brutalist-input w-full font-body-md text-body-md text-primary" placeholder="••••••••" type="password"/></div><div class="flex items-start gap-3 mt-4 p-4 border border-outline-variant bg-surface-container-low"><div class="flex h-5 items-center mt-0.5"><div class="relative flex items-center justify-center w-5 h-5 border-2 border-primary rounded-sm cursor-pointer" onclick="this.classList.toggle('bg-error'); this.classList.toggle('border-error'); this.querySelector('span').classList.toggle('hidden')"><span class="material-symbols-outlined text-on-primary text-[16px] hidden pointer-events-none" data-icon="close">close</span></div></div><div class="font-label-mono text-xs text-on-surface-variant leading-tight">I SWEAR THAT THE INFORMATION PROVIDED IS ACCURATE TO THE BEST OF MY KNOWLEDGE AND BINDING UNDER OFFICIAL PROTOCOL.</div></div><div class="pt-4"><button class="brutalist-button w-full bg-surface text-primary border-2 border-primary py-3 font-label-caps text-label-caps text-center hover:bg-surface-variant" type="button">SUBMIT ENTRY</button></div></form></div><div class="mt-4 flex justify-between font-label-mono text-xs text-surface-tint opacity-70 px-4"><span>SECURE TERMINAL</span><span>TS: 2024.10.24-1800</span></div></div><script>function toggleForm(type) {const loginForm = document.getElementById('form-login');const registerForm = document.getElementById('form-register');const loginTab = document.getElementById('tab-login');const registerTab = document.getElementById('tab-register');if (type === 'login') {loginForm.classList.remove('hidden');registerForm.classList.add('hidden');loginTab.classList.replace('bg-surface-variant', 'bg-surface');loginTab.classList.replace('text-on-surface-variant', 'text-primary');registerTab.classList.replace('bg-surface', 'bg-surface-variant');registerTab.classList.replace('text-primary', 'text-on-surface-variant');} else {loginForm.classList.add('hidden');registerForm.classList.remove('hidden');registerTab.classList.replace('bg-surface-variant', 'bg-surface');registerTab.classList.replace('text-on-surface-variant', 'text-primary');loginTab.classList.replace('bg-surface', 'bg-surface-variant');loginTab.classList.replace('text-primary', 'text-on-surface-variant');}}</script></body></html>

spring:
  application:
    name: vote-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vote_system}
    username: ${DB_USERNAME:vote}
    password: ${DB_PASSWORD:vote}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      repositories:
        enabled: false
  cache:
    type: redis
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        generate_statistics: true
  flyway:
    enabled: true
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${OAUTH_SESSION_TIMEOUT:10m}
      cookie:
        name: ${OAUTH_SESSION_COOKIE_NAME:vote_oauth}
        http-only: true
        secure: ${OAUTH_SESSION_COOKIE_SECURE:false}
        same-site: ${OAUTH_SESSION_COOKIE_SAME_SITE:Lax}

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: DEBUG
    org.hibernate.engine.transaction.internal.TransactionImpl: DEBUG
    org.hibernate.stat: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:true}

app:
  vote:
    verdict-threshold: ${VOTE_VERDICT_THRESHOLD:70}
  vote-stream:
    heartbeat-ms: ${VOTE_STREAM_HEARTBEAT_MS:15000}
    timeout-ms: ${VOTE_STREAM_TIMEOUT_MS:1800000}
  vote-side-effects:
    queue-capacity: ${VOTE_SIDE_EFFECT_QUEUE_CAPACITY:200}
    shutdown-wait-seconds: ${VOTE_SIDE_EFFECT_SHUTDOWN_WAIT_SECONDS:10}
  social-login:
    success-url: ${SOCIAL_LOGIN_SUCCESS_URL:/}
    failure-url: ${SOCIAL_LOGIN_FAILURE_URL:/}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
  cache:
    default-ttl: ${CACHE_DEFAULT_TTL:PT30S}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
    login:
      limit: ${RATE_LIMIT_LOGIN_LIMIT:5}
      window: ${RATE_LIMIT_LOGIN_WINDOW:PT1M}
    register:
      limit: ${RATE_LIMIT_REGISTER_LIMIT:3}
      window: ${RATE_LIMIT_REGISTER_WINDOW:PT1H}
    refresh:
      limit: ${RATE_LIMIT_REFRESH_LIMIT:20}
      window: ${RATE_LIMIT_REFRESH_WINDOW:PT1M}
    social-start:
      limit: ${RATE_LIMIT_SOCIAL_START_LIMIT:20}
      window: ${RATE_LIMIT_SOCIAL_START_WINDOW:PT1M}
    create-post:
      limit: ${RATE_LIMIT_CREATE_POST_LIMIT:10}
      window: ${RATE_LIMIT_CREATE_POST_WINDOW:PT1H}
    vote:
      limit: ${RATE_LIMIT_VOTE_LIMIT:30}
      window: ${RATE_LIMIT_VOTE_WINDOW:PT1M}
    profile-update:
      limit: ${RATE_LIMIT_PROFILE_UPDATE_LIMIT:10}
      window: ${RATE_LIMIT_PROFILE_UPDATE_WINDOW:PT1H}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    jwt:
      issuer: ${JWT_ISSUER:vote-system}
      secret: ${JWT_SECRET:dev-only-change-me-0123456789abcdef}
      access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:P30D}
      cookie-name: ${REFRESH_COOKIE_NAME:vote_refresh}
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

name: TON-127 Profile Snapshot Publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ton127-profile-snapshot-publisher.yml
      - .chatgpt/ton127/**

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout publisher branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          parts="$GITHUB_WORKSPACE/.chatgpt/ton127"
          patch="$RUNNER_TEMP/ton127.patch"
          cat "$parts/chunk-00.b64" "$parts/chunk-01.b64" "$parts/chunk-02.b64" "$parts/chunk-03.b64" \
            | base64 --decode | gzip --decompress > "$patch"
          echo '87cbaff945ef66a67e5962ed9c4618a203ec6e1ec62126211275c4c63d15496a  '"$patch" | sha256sum --check

      - name: Apply TON-127 on exact main base
        shell: bash
        run: |
          set -euo pipefail
          expected_base='1b5a865b1973fd1d7ced76b65ffb28f031a1d14d'
          test "${{ github.event.pull_request.base.sha }}" = "$expected_base"
          git checkout --detach "$expected_base"
          git apply --check "$RUNNER_TEMP/ton127.patch"
          git apply "$RUNNER_TEMP/ton127.patch"
          git diff --check
          python3 -m py_compile frontend/scripts/ton106_qa_server.py
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path('.github/workflows/auth-bootstrap-qa.yml').read_text())
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Publish allowlisted task source
        shell: bash
        run: |
          set -euo pipefail
          base='1b5a865b1973fd1d7ced76b65ffb28f031a1d14d'

          rm -rf frontend/.test-dist frontend/.next frontend/scripts/__pycache__
          git restore --source="$base" --staged --worktree \
            .github/workflows/auth-bootstrap-qa.yml \
            frontend/tsconfig.json \
            frontend/next-env.d.ts

          cat > "$RUNNER_TEMP/expected-files" <<'FILES'
          frontend/scripts/ton106_qa_server.py
          frontend/src/features/auth/components/VoterMasthead.module.scss
          frontend/src/features/auth/components/VoterMasthead.tsx
          frontend/src/features/auth/hooks/useSession.ts
          frontend/src/features/ballots/components/BallotApp.tsx
          frontend/src/shared/auth/profile-snapshot.ts
          frontend/src/shared/auth/tests/profile-snapshot.test.ts
          FILES
          sort -o "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/expected-files"
          git status --short | awk '{print $2}' | sort > "$RUNNER_TEMP/actual-files"
          echo 'TON-127 publish allowlist:'
          cat "$RUNNER_TEMP/actual-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          git diff --check

          git config user.name 'vote-system-automation'
          git config user.email 'actions@users.noreply.github.com'
          xargs -a "$RUNNER_TEMP/expected-files" git add --
          git commit -m 'TON-127 Add safe profile presentation snapshot'
          git diff --name-only "$base" HEAD | sort > "$RUNNER_TEMP/committed-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/committed-files"
          git push --force-with-lease=refs/heads/hungtvb2020/ton-127-fe-add-safe-profile-snapshot-for-instant-masthead-rendering:$base \
            origin HEAD:refs/heads/hungtvb2020/ton-127-fe-add-safe-profile-snapshot-for-instant-masthead-rendering

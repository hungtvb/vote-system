name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress verify 2>&1 | tee backend-build.log
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-log
          path: |
            backend-build.log
            target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test API lifecycle and UI state models
        run: npm test
      - name: Verify Ballot Edition contrast
        run: python3 scripts/accessibility_checks.py
      - name: Build frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log
      - name: Run visual and accessibility QA
        run: |
          set -euo pipefail
          mkdir -p visual-qa
          python3 scripts/ton106_qa_server.py > visual-qa/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              cat visual-qa/server.log
              exit 1
            fi
            sleep 0.25
          done

          CHROME=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME=$(command -v "$candidate")
              break
            fi
          done
          if [ -z "$CHROME" ]; then
            echo 'No headless Chrome binary is available on the runner.'
            exit 1
          fi

          capture() {
            name=$1
            width=$2
            height=$3
            mode=$4
            expected_cards=${5:-3}
            extra_flag=${6:-}
            url="http://127.0.0.1:4173/?qa=${mode}"
            common=(--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=7000 --window-size="${width},${height}")
            if [ -n "$extra_flag" ]; then
              common+=("$extra_flag")
            fi
            "$CHROME" "${common[@]}" --screenshot="visual-qa/${name}.png" "$url"
            "$CHROME" "${common[@]}" --dump-dom "$url" > "visual-qa/${name}.html"
            grep -q 'data-qa-overflow="false"' "visual-qa/${name}.html"
            grep -q "data-qa-cards=\"${expected_cards}\"" "visual-qa/${name}.html"
          }

          assert_feed_boundaries() {
            file=$1
            grep -q 'data-qa-vote-splits="100/0,50/50,0/0"' "$file"
            grep -q 'data-qa-stamps="2"' "$file"
            grep -q 'data-qa-current-stamps="1"' "$file"
            grep -q 'data-qa-final-stamps="1"' "$file"
            grep -q 'data-qa-stamp-animating="0"' "$file"
          }

          assert_feed() {
            file=$1
            grep -q 'data-qa-authors="3"' "$file"
            assert_feed_boundaries "$file"
          }

          # Required TON-106 viewport matrix.
          capture desktop-1440x900 1440 900 feed
          capture laptop-1024x768 1024 768 feed
          capture tablet-768x1024 768 1024 feed
          capture mobile-390x844 390 844 feed
          capture mobile-375x812 375 812 feed
          capture compact-320x568 320 568 feed
          for file in \
            visual-qa/desktop-1440x900.html \
            visual-qa/laptop-1024x768.html \
            visual-qa/tablet-768x1024.html \
            visual-qa/mobile-390x844.html \
            visual-qa/mobile-375x812.html \
            visual-qa/compact-320x568.html; do
            assert_feed "$file"
          done
          grep -q 'data-qa-guest="true"' visual-qa/desktop-1440x900.html
          grep -q 'data-qa-voter="false"' visual-qa/desktop-1440x900.html

          capture mobile-detail 390 844 detail
          grep -q 'data-qa-dialog="true"' visual-qa/mobile-detail.html
          grep -q 'data-qa-dialog-overflow="false"' visual-qa/mobile-detail.html
          grep -q 'data-qa-authors="4"' visual-qa/mobile-detail.html

          capture desktop-auth 1024 768 auth
          grep -q 'data-qa-authors="3"' visual-qa/desktop-auth.html
          grep -q 'data-qa-voter="true"' visual-qa/desktop-auth.html
          grep -q 'data-qa-guest="false"' visual-qa/desktop-auth.html
          assert_feed_boundaries visual-qa/desktop-auth.html

          capture mobile-auth-menu 375 812 auth-menu
          grep -q 'data-qa-authors="3"' visual-qa/mobile-auth-menu.html
          grep -q 'data-qa-voter="true"' visual-qa/mobile-auth-menu.html
          grep -q 'data-qa-menu="true"' visual-qa/mobile-auth-menu.html
          grep -q 'data-qa-guest="false"' visual-qa/mobile-auth-menu.html

          capture tablet-stamp-transition 768 1024 auth-stamp
          grep -q 'data-qa-voter="true"' visual-qa/tablet-stamp-transition.html
          grep -q 'data-qa-stamps="3"' visual-qa/tablet-stamp-transition.html
          grep -q 'data-qa-current-stamps="2"' visual-qa/tablet-stamp-transition.html
          grep -q 'data-qa-final-stamps="1"' visual-qa/tablet-stamp-transition.html
          grep -q 'data-qa-stamp-animating="1"' visual-qa/tablet-stamp-transition.html

          capture tablet-server-search 768 1024 server-search 1
          grep -q 'Registry-wide server-only search result' visual-qa/tablet-server-search.html
          grep -q 'data-qa-active-feed="LATEST"' visual-qa/tablet-server-search.html

          capture desktop-pagination 1440 900 pagination 3
          grep -q 'PAGE 2 OF 2' visual-qa/desktop-pagination.html
          grep -q 'data-qa-active-feed="LATEST"' visual-qa/desktop-pagination.html

          capture mobile-my-ballots 390 844 auth-mine 1
          grep -q 'data-qa-voter="true"' visual-qa/mobile-my-ballots.html
          grep -q 'data-qa-active-feed="MY BALLOTS"' visual-qa/mobile-my-ballots.html
          grep -q 'Should public software projects publish' visual-qa/mobile-my-ballots.html

          # Registration and create-ballot actions must remain distinct.
          capture guest-register-dialog 390 844 guest-register-dialog
          grep -q 'data-qa-auth-dialog="true"' visual-qa/guest-register-dialog.html
          grep -q 'data-qa-auth-mode="register"' visual-qa/guest-register-dialog.html
          grep -q 'data-qa-auth-submit="CREATE ACCOUNT"' visual-qa/guest-register-dialog.html
          grep -q 'data-qa-create-dialog="false"' visual-qa/guest-register-dialog.html
          grep -q 'data-qa-focus-inside-dialog="true"' visual-qa/guest-register-dialog.html
          grep -q 'data-qa-touch-violations="0"' visual-qa/guest-register-dialog.html

          capture guest-create-auth 390 844 guest-create-auth
          grep -q 'data-qa-create-label="CREATE BALLOT"' visual-qa/guest-create-auth.html
          grep -q 'data-qa-auth-dialog="true"' visual-qa/guest-create-auth.html
          grep -q 'data-qa-auth-mode="login"' visual-qa/guest-create-auth.html
          grep -q 'data-qa-auth-submit="SIGN IN"' visual-qa/guest-create-auth.html
          grep -q 'data-qa-create-dialog="false"' visual-qa/guest-create-auth.html
          grep -q 'data-qa-focus-inside-dialog="true"' visual-qa/guest-create-auth.html
          grep -q 'data-qa-touch-violations="0"' visual-qa/guest-create-auth.html

          capture guest-register-complete 390 844 guest-register-complete
          grep -q 'data-qa-voter-after-auth="true"' visual-qa/guest-register-complete.html
          grep -q 'data-qa-auth-dialog="false"' visual-qa/guest-register-complete.html
          grep -q 'data-qa-create-dialog="false"' visual-qa/guest-register-complete.html

          capture guest-create-resume 390 844 guest-create-resume
          grep -q 'data-qa-voter-after-auth="true"' visual-qa/guest-create-resume.html
          grep -q 'data-qa-auth-dialog="false"' visual-qa/guest-create-resume.html
          grep -q 'data-qa-create-dialog="true"' visual-qa/guest-create-resume.html
          grep -q 'data-qa-submit-ballot="SUBMIT BALLOT"' visual-qa/guest-create-resume.html
          grep -q 'data-qa-focus-inside-dialog="true"' visual-qa/guest-create-resume.html
          grep -q 'data-qa-touch-violations="0"' visual-qa/guest-create-resume.html

          capture reduced-motion 375 812 reduced-motion 3 --force-prefers-reduced-motion=reduce
          grep -q 'data-qa-reduced-motion="true"' visual-qa/reduced-motion.html
          grep -q 'data-qa-reduced-scroll="auto"' visual-qa/reduced-motion.html
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-qa
          path: frontend/visual-qa/**
          if-no-files-found: error
          retention-days: 14
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: frontend/frontend-build.log
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag vote-system:ci .
      - name: Run production runtime smoke
        run: bash scripts/ci/runtime-smoke.sh
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-runtime-smoke
          path: runtime-smoke/**
          if-no-files-found: ignore
          retention-days: 14

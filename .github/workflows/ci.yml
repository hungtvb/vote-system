name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress verify 2>&1 | tee backend-build.log
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-log
          path: |
            backend-build.log
            target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test API lifecycle
        run: npm test
      - name: Build frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log
      - name: Run visual QA
        run: |
          set -euo pipefail
          mkdir -p visual-qa
          python3 scripts/visual_qa_server.py > visual-qa/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              cat visual-qa/server.log
              exit 1
            fi
            sleep 0.25
          done

          CHROME=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME=$(command -v "$candidate")
              break
            fi
          done
          if [ -z "$CHROME" ]; then
            echo 'No headless Chrome binary is available on the runner.'
            exit 1
          fi

          capture() {
            name=$1
            width=$2
            height=$3
            mode=$4
            url="http://127.0.0.1:4173/?qa=${mode}"
            common=(--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=7000 --window-size="${width},${height}")
            "$CHROME" "${common[@]}" --screenshot="visual-qa/${name}.png" "$url"
            "$CHROME" "${common[@]}" --dump-dom "$url" > "visual-qa/${name}.html"
            grep -q 'data-qa-overflow="false"' "visual-qa/${name}.html"
            grep -q 'data-qa-cards="3"' "visual-qa/${name}.html"
          }

          assert_feed_boundaries() {
            file=$1
            grep -q 'data-qa-vote-splits="100/0,50/50,0/0"' "$file"
            grep -q 'data-qa-stamps="2"' "$file"
            grep -q 'data-qa-current-stamps="1"' "$file"
            grep -q 'data-qa-final-stamps="1"' "$file"
            grep -q 'data-qa-stamp-animating="0"' "$file"
          }

          capture mobile-feed 375 812 feed
          capture tablet-feed 768 1024 feed
          capture desktop-feed 1440 1000 feed
          grep -q 'data-qa-authors="3"' visual-qa/mobile-feed.html
          grep -q 'data-qa-authors="3"' visual-qa/tablet-feed.html
          grep -q 'data-qa-authors="3"' visual-qa/desktop-feed.html
          grep -q 'data-qa-guest="true"' visual-qa/desktop-feed.html
          grep -q 'data-qa-voter="false"' visual-qa/desktop-feed.html
          assert_feed_boundaries visual-qa/mobile-feed.html
          assert_feed_boundaries visual-qa/tablet-feed.html
          assert_feed_boundaries visual-qa/desktop-feed.html

          capture mobile-detail 375 812 detail
          grep -q 'data-qa-dialog="true"' visual-qa/mobile-detail.html
          grep -q 'data-qa-dialog-overflow="false"' visual-qa/mobile-detail.html
          grep -q 'data-qa-authors="4"' visual-qa/mobile-detail.html

          capture desktop-auth 1440 1000 auth
          grep -q 'data-qa-authors="3"' visual-qa/desktop-auth.html
          grep -q 'data-qa-voter="true"' visual-qa/desktop-auth.html
          grep -q 'data-qa-guest="false"' visual-qa/desktop-auth.html
          assert_feed_boundaries visual-qa/desktop-auth.html

          capture mobile-auth-menu 375 812 auth-menu
          grep -q 'data-qa-authors="3"' visual-qa/mobile-auth-menu.html
          grep -q 'data-qa-voter="true"' visual-qa/mobile-auth-menu.html
          grep -q 'data-qa-menu="true"' visual-qa/mobile-auth-menu.html
          grep -q 'data-qa-guest="false"' visual-qa/mobile-auth-menu.html

          capture tablet-stamp-transition 768 1024 auth-stamp
          grep -q 'data-qa-voter="true"' visual-qa/tablet-stamp-transition.html
          grep -q 'data-qa-stamps="3"' visual-qa/tablet-stamp-transition.html
          grep -q 'data-qa-current-stamps="2"' visual-qa/tablet-stamp-transition.html
          grep -q 'data-qa-final-stamps="1"' visual-qa/tablet-stamp-transition.html
          grep -q 'data-qa-stamp-animating="1"' visual-qa/tablet-stamp-transition.html
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-qa
          path: frontend/visual-qa/**
          if-no-files-found: error
          retention-days: 14
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: frontend/frontend-build.log
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag vote-system:ci .

name: ChatGPT TON-176 i18n Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: chatgpt-ton176-i18n-publisher
  cancel-in-progress: true

jobs:
  publish:
    if: github.head_ref == 'automation/chatgpt-ton176-publish-61c0b8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve catalog formatting on TON-176 branch
        env:
          TARGET_BRANCH: hungtvb2020/ton-176-public-frontend-read-only-banner-and-maintenance-screen
          EXPECTED_TREE: 9ff676babe5b6ef90a585a9e84c8f127ebf067dc
        run: |
          set -euo pipefail
          git config user.name "OpenAI ChatGPT"
          git config user.email "chatgpt@openai.com"
          git fetch origin main "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          for language in ('en', 'vi'):
              path = f'frontend/src/shared/i18n/messages/{language}.json'
              current = json.loads(Path(path).read_text())
              system_line = '  "system": ' + json.dumps(
                  current['system'], ensure_ascii=False, separators=(',', ':')
              ) + ',\n'
              base_text = subprocess.check_output(
                  ['git', 'show', f'origin/main:{path}'], text=True
              )
              marker = '  "comments": {},"notifications": {},\n'
              if marker not in base_text:
                  raise SystemExit(f'catalog marker missing: {path}')
              Path(path).write_text(base_text.replace(marker, system_line + marker, 1))
          PY
          git add frontend/src/shared/i18n/messages/en.json frontend/src/shared/i18n/messages/vi.json
          git commit -m "TON-176 Preserve i18n catalog reviewability"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

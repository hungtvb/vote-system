name: Inspect TON-198 ranking

on:
  pull_request:
    paths:
      - .github/workflows/inspect-ton198.yml
  push:
    branches:
      - hungtvb2020/ton-198-be-audited-ranking-status-and-atomic-rebuild-operation
    paths:
      - .github/workflows/inspect-ton198.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List ranking-related source
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FILES ==='
          find src/main/java src/test/java src/main/resources -type f | sort | grep -Ei 'rank|redis|feed|audit|post' || true
          echo '=== SYMBOLS ==='
          grep -RInE 'TOP_WEEK|TOP_DAY|HOT|Ranking|ranking|ZSetOperations|StringRedisTemplate|RedisTemplate|rebuild' src/main/java src/test/java src/main/resources | head -n 1200 || true
          echo '=== END TON-198 INSPECTION ==='

name: Implement TON-198 core

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/implement-ton198-core.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Write atomic ranking implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/main/java/com/hungtvb/votesystem/admin/ranking/dto

          cat > src/main/java/com/hungtvb/votesystem/ranking/RedisRankingRepository.java <<'JAVA'
          package com.hungtvb.votesystem.ranking;

          import org.springframework.data.redis.core.StringRedisTemplate;
          import org.springframework.data.redis.core.script.DefaultRedisScript;
          import org.springframework.stereotype.Repository;

          import java.time.Duration;
          import java.time.Instant;
          import java.time.LocalDate;
          import java.time.ZoneOffset;
          import java.time.temporal.TemporalAdjusters;
          import java.time.DayOfWeek;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import java.util.UUID;

          @Repository
          public class RedisRankingRepository {
              private static final String LEGACY_HOT_KEY = "feed:hot";
              private static final String ACTIVE_GENERATION_KEY = "feed:{ranking}:active-generation";
              private static final String METADATA_KEY = "feed:{ranking}:metadata";
              private static final String REBUILD_LOCK_KEY = "feed:{ranking}:rebuild-lock";
              private static final Duration STAGING_TTL = Duration.ofMinutes(15);
              private static final Duration OLD_GENERATION_TTL = Duration.ofHours(1);

              private static final DefaultRedisScript<Long> RELEASE_LOCK_SCRIPT = new DefaultRedisScript<>("""
                      if redis.call('GET', KEYS[1]) == ARGV[1] then
                        return redis.call('DEL', KEYS[1])
                      end
                      return 0
                      """, Long.class);

              private static final DefaultRedisScript<Long> PUBLISH_SCRIPT = new DefaultRedisScript<>("""
                      if redis.call('GET', KEYS[1]) ~= ARGV[1] then return -1 end
                      if redis.call('ZCARD', KEYS[4]) ~= tonumber(ARGV[6]) then return -2 end
                      if redis.call('ZCARD', KEYS[5]) ~= tonumber(ARGV[7]) then return -2 end
                      if redis.call('ZCARD', KEYS[6]) ~= tonumber(ARGV[8]) then return -2 end

                      redis.call('PERSIST', KEYS[4])
                      redis.call('PERSIST', KEYS[5])
                      redis.call('PERSIST', KEYS[6])
                      redis.call('SET', KEYS[2], ARGV[2])
                      redis.call('HSET', KEYS[3],
                        'generation', ARGV[2],
                        'published_at', ARGV[3],
                        'window_day', ARGV[4],
                        'window_week', ARGV[5])

                      if ARGV[9] ~= '' and ARGV[9] ~= ARGV[2] then
                        redis.call('EXPIRE', KEYS[7], tonumber(ARGV[10]))
                        redis.call('EXPIRE', KEYS[8], tonumber(ARGV[10]))
                        redis.call('EXPIRE', KEYS[9], tonumber(ARGV[10]))
                      end
                      return 1
                      """, Long.class);

              private static final DefaultRedisScript<Long> ROLLBACK_SCRIPT = new DefaultRedisScript<>("""
                      if redis.call('GET', KEYS[1]) ~= ARGV[1] then return -1 end
                      if redis.call('GET', KEYS[2]) ~= ARGV[2] then return -2 end

                      if ARGV[3] == '' then
                        redis.call('DEL', KEYS[2])
                        redis.call('DEL', KEYS[3])
                      else
                        redis.call('SET', KEYS[2], ARGV[3])
                        redis.call('HSET', KEYS[3],
                          'generation', ARGV[3],
                          'published_at', ARGV[4],
                          'window_day', ARGV[5],
                          'window_week', ARGV[6])
                        redis.call('PERSIST', KEYS[7])
                        redis.call('PERSIST', KEYS[8])
                        redis.call('PERSIST', KEYS[9])
                      end

                      redis.call('EXPIRE', KEYS[4], tonumber(ARGV[7]))
                      redis.call('EXPIRE', KEYS[5], tonumber(ARGV[7]))
                      redis.call('EXPIRE', KEYS[6], tonumber(ARGV[7]))
                      return 1
                      """, Long.class);

              private final StringRedisTemplate redis;

              public RedisRankingRepository(StringRedisTemplate redis) {
                  this.redis = redis;
              }

              public void upsert(UUID postId, long voteScore, double hotScore, Instant createdAt, Instant now) {
                  String generation = activeGeneration();
                  String member = postId.toString();
                  redis.opsForZSet().add(key(generation, FeedType.HOT, now), member, hotScore);
                  if (isSameUtcDay(createdAt, now)) {
                      redis.opsForZSet().add(key(generation, FeedType.TOP_DAY, now), member, voteScore);
                  } else {
                      redis.opsForZSet().remove(key(generation, FeedType.TOP_DAY, now), member);
                  }
                  if (isSameUtcWeek(createdAt, now)) {
                      redis.opsForZSet().add(key(generation, FeedType.TOP_WEEK, now), member, voteScore);
                  } else {
                      redis.opsForZSet().remove(key(generation, FeedType.TOP_WEEK, now), member);
                  }
              }

              public void remove(UUID postId, Instant now) {
                  String generation = activeGeneration();
                  String member = postId.toString();
                  redis.opsForZSet().remove(key(generation, FeedType.HOT, now), member);
                  redis.opsForZSet().remove(key(generation, FeedType.TOP_DAY, now), member);
                  redis.opsForZSet().remove(key(generation, FeedType.TOP_WEEK, now), member);
              }

              public List<UUID> range(FeedType feed, long offset, int size, Instant now) {
                  Set<String> members = redis.opsForZSet().reverseRange(key(activeGeneration(), feed, now), offset, offset + size - 1L);
                  if (members == null) return List.of();
                  return new LinkedHashSet<>(members).stream().map(UUID::fromString).toList();
              }

              public long count(FeedType feed, Instant now) {
                  Long size = redis.opsForZSet().zCard(key(activeGeneration(), feed, now));
                  return size == null ? 0 : size;
              }

              public boolean isEmpty(FeedType feed, Instant now) {
                  return count(feed, now) == 0;
              }

              public RankingCounts currentCounts(Instant now) {
                  String generation = activeGeneration();
                  return new RankingCounts(
                          size(key(generation, FeedType.HOT, now)),
                          size(key(generation, FeedType.TOP_DAY, now)),
                          size(key(generation, FeedType.TOP_WEEK, now))
                  );
              }

              public RankingMetadata metadata() {
                  String generation = activeGeneration();
                  if (generation == null || generation.isBlank()) return RankingMetadata.empty();
                  Map<Object, Object> values = redis.opsForHash().entries(METADATA_KEY);
                  return new RankingMetadata(
                          generation,
                          parseInstant(values.get("published_at")),
                          stringValue(values.get("window_day")),
                          stringValue(values.get("window_week"))
                  );
              }

              public boolean needsWindowRebuild(Instant now) {
                  RankingMetadata metadata = metadata();
                  return metadata.generation() == null
                          || !dayValue(now).equals(metadata.windowDay())
                          || !weekValue(now).equals(metadata.windowWeek());
              }

              public boolean tryAcquireRebuildLock(String token, Duration ttl) {
                  return Boolean.TRUE.equals(redis.opsForValue().setIfAbsent(REBUILD_LOCK_KEY, token, ttl));
              }

              public boolean isRebuildInProgress() {
                  return Boolean.TRUE.equals(redis.hasKey(REBUILD_LOCK_KEY));
              }

              public void releaseRebuildLock(String token) {
                  redis.execute(RELEASE_LOCK_SCRIPT, List.of(REBUILD_LOCK_KEY), token);
              }

              public RankingGeneration createGeneration(String generationId) {
                  return new RankingGeneration(
                          generationId,
                          generationKey(generationId, FeedType.HOT),
                          generationKey(generationId, FeedType.TOP_DAY),
                          generationKey(generationId, FeedType.TOP_WEEK)
                  );
              }

              public void stageUpsert(RankingGeneration generation, UUID postId, long voteScore,
                                      double hotScore, Instant createdAt, Instant now) {
                  String member = postId.toString();
                  redis.opsForZSet().add(generation.hotKey(), member, hotScore);
                  redis.expire(generation.hotKey(), STAGING_TTL);
                  if (isSameUtcDay(createdAt, now)) {
                      redis.opsForZSet().add(generation.dayKey(), member, voteScore);
                      redis.expire(generation.dayKey(), STAGING_TTL);
                  }
                  if (isSameUtcWeek(createdAt, now)) {
                      redis.opsForZSet().add(generation.weekKey(), member, voteScore);
                      redis.expire(generation.weekKey(), STAGING_TTL);
                  }
              }

              public RankingCounts generationCounts(RankingGeneration generation) {
                  return new RankingCounts(size(generation.hotKey()), size(generation.dayKey()), size(generation.weekKey()));
              }

              public PublishState publishGeneration(RankingGeneration generation, RankingCounts expected,
                                                    String token, Instant publishedAt) {
                  RankingMetadata previous = metadata();
                  RankingGeneration oldGeneration = previous.generation() == null
                          ? generation
                          : createGeneration(previous.generation());
                  Long result = redis.execute(PUBLISH_SCRIPT, List.of(
                                  REBUILD_LOCK_KEY,
                                  ACTIVE_GENERATION_KEY,
                                  METADATA_KEY,
                                  generation.hotKey(),
                                  generation.dayKey(),
                                  generation.weekKey(),
                                  oldGeneration.hotKey(),
                                  oldGeneration.dayKey(),
                                  oldGeneration.weekKey()),
                          token,
                          generation.id(),
                          publishedAt.toString(),
                          dayValue(publishedAt),
                          weekValue(publishedAt),
                          Long.toString(expected.hot()),
                          Long.toString(expected.day()),
                          Long.toString(expected.week()),
                          previous.generation() == null ? "" : previous.generation(),
                          Long.toString(OLD_GENERATION_TTL.toSeconds()));
                  if (result == null || result != 1L) {
                      throw new IllegalStateException("Ranking generation publish was rejected");
                  }
                  return new PublishState(previous, currentCounts(publishedAt));
              }

              public void rollbackGeneration(RankingGeneration generation, PublishState state,
                                             String token, Instant now) {
                  RankingMetadata previous = state.previousMetadata();
                  RankingGeneration oldGeneration = previous.generation() == null
                          ? generation
                          : createGeneration(previous.generation());
                  Long result = redis.execute(ROLLBACK_SCRIPT, List.of(
                                  REBUILD_LOCK_KEY,
                                  ACTIVE_GENERATION_KEY,
                                  METADATA_KEY,
                                  generation.hotKey(),
                                  generation.dayKey(),
                                  generation.weekKey(),
                                  oldGeneration.hotKey(),
                                  oldGeneration.dayKey(),
                                  oldGeneration.weekKey()),
                          token,
                          generation.id(),
                          previous.generation() == null ? "" : previous.generation(),
                          previous.publishedAt() == null ? "" : previous.publishedAt().toString(),
                          previous.windowDay() == null ? "" : previous.windowDay(),
                          previous.windowWeek() == null ? "" : previous.windowWeek(),
                          Long.toString(STAGING_TTL.toSeconds()));
                  if (result == null || result != 1L) {
                      throw new IllegalStateException("Ranking generation rollback was rejected");
                  }
              }

              public void discardGeneration(RankingGeneration generation) {
                  redis.delete(List.of(generation.hotKey(), generation.dayKey(), generation.weekKey()));
              }

              private long size(String key) {
                  Long size = redis.opsForZSet().zCard(key);
                  return size == null ? 0 : size;
              }

              private String activeGeneration() {
                  String generation = redis.opsForValue().get(ACTIVE_GENERATION_KEY);
                  return generation == null || generation.isBlank() ? null : generation;
              }

              private String key(String generation, FeedType feed, Instant now) {
                  if (generation != null) return generationKey(generation, feed);
                  return legacyKey(feed, now);
              }

              private String generationKey(String generation, FeedType feed) {
                  String suffix = switch (feed) {
                      case HOT -> "hot";
                      case TOP_DAY -> "day";
                      case TOP_WEEK -> "week";
                      case LATEST, MINE -> throw new IllegalArgumentException(feed + " is database-backed");
                  };
                  return "feed:{ranking}:generation:" + generation + ":" + suffix;
              }

              private String legacyKey(FeedType feed, Instant now) {
                  return switch (feed) {
                      case HOT -> LEGACY_HOT_KEY;
                      case TOP_DAY -> "feed:top:day:" + dayValue(now);
                      case TOP_WEEK -> "feed:top:week:" + weekValue(now);
                      case LATEST, MINE -> throw new IllegalArgumentException(feed + " is database-backed");
                  };
              }

              private String dayValue(Instant now) {
                  return LocalDate.ofInstant(now, ZoneOffset.UTC).toString();
              }

              private String weekValue(Instant now) {
                  return LocalDate.ofInstant(now, ZoneOffset.UTC)
                          .with(TemporalAdjusters.previousOrSame(DayOfWeek.MONDAY))
                          .toString();
              }

              private boolean isSameUtcDay(Instant first, Instant second) {
                  return dayValue(first).equals(dayValue(second));
              }

              private boolean isSameUtcWeek(Instant first, Instant second) {
                  return weekValue(first).equals(weekValue(second));
              }

              private Instant parseInstant(Object value) {
                  if (value == null) return null;
                  try {
                      return Instant.parse(value.toString());
                  } catch (RuntimeException ignored) {
                      return null;
                  }
              }

              private String stringValue(Object value) {
                  return value == null ? null : value.toString();
              }

              public record RankingGeneration(String id, String hotKey, String dayKey, String weekKey) {}
              public record RankingCounts(long hot, long day, long week) {}
              public record RankingMetadata(String generation, Instant publishedAt, String windowDay, String windowWeek) {
                  static RankingMetadata empty() { return new RankingMetadata(null, null, null, null); }
              }
              public record PublishState(RankingMetadata previousMetadata, RankingCounts publishedCounts) {}
          }
          JAVA

          cat > src/main/java/com/hungtvb/votesystem/ranking/RankingAvailability.java <<'JAVA'
          package com.hungtvb.votesystem.ranking;

          public enum RankingAvailability {
              HEALTHY,
              STALE,
              REBUILDING,
              UNAVAILABLE
          }
          JAVA

          cat > src/main/java/com/hungtvb/votesystem/ranking/RankingStatusSnapshot.java <<'JAVA'
          package com.hungtvb.votesystem.ranking;

          import java.time.Instant;

          public record RankingStatusSnapshot(
                  RankingAvailability availability,
                  long visibleBallots,
                  long eligibleDayBallots,
                  long eligibleWeekBallots,
                  Long hotMembers,
                  Long topDayMembers,
                  Long topWeekMembers,
                  String generation,
                  Instant lastSuccessfulRebuildAt,
                  boolean rebuildInProgress
          ) {
          }
          JAVA

          cat > src/main/java/com/hungtvb/votesystem/ranking/RankingRebuildResult.java <<'JAVA'
          package com.hungtvb.votesystem.ranking;

          import java.time.Instant;

          public record RankingRebuildResult(
                  String lockToken,
                  RedisRankingRepository.RankingGeneration generation,
                  RedisRankingRepository.PublishState publishState,
                  RedisRankingRepository.RankingCounts previousCounts,
                  RedisRankingRepository.RankingCounts publishedCounts,
                  int visiblePostCount,
                  Instant publishedAt
          ) {
          }
          JAVA

          cat > src/main/java/com/hungtvb/votesystem/ranking/RankingService.java <<'JAVA'
          package com.hungtvb.votesystem.ranking;

          import com.hungtvb.votesystem.common.error.ConflictException;
          import com.hungtvb.votesystem.post.Post;
          import com.hungtvb.votesystem.post.PostFilter;
          import com.hungtvb.votesystem.post.PostRepository;
          import com.hungtvb.votesystem.post.PostSpecifications;
          import io.micrometer.core.instrument.Counter;
          import io.micrometer.core.instrument.MeterRegistry;
          import org.springframework.dao.DataAccessException;
          import org.springframework.data.domain.Page;
          import org.springframework.data.domain.PageImpl;
          import org.springframework.data.domain.PageRequest;
          import org.springframework.data.domain.Pageable;
          import org.springframework.data.domain.Sort;
          import org.springframework.data.jpa.domain.Specification;
          import org.springframework.stereotype.Service;

          import java.time.Clock;
          import java.time.DayOfWeek;
          import java.time.Duration;
          import java.time.Instant;
          import java.time.LocalDate;
          import java.time.ZoneOffset;
          import java.time.temporal.TemporalAdjusters;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Map;
          import java.util.UUID;
          import java.util.function.Function;
          import java.util.stream.Collectors;

          @Service
          public class RankingService {
              private static final int FILTER_SCAN_CHUNK_SIZE = 200;
              private static final Duration REBUILD_LOCK_TTL = Duration.ofMinutes(5);

              private final RedisRankingRepository rankingRepository;
              private final PostRepository postRepository;
              private final RankingFormula formula;
              private final Clock clock = Clock.systemUTC();
              private final Counter updates;
              private final Counter rebuilds;
              private final Counter fallbacks;
              private final Counter rebuildRequested;
              private final Counter rebuildSucceeded;
              private final Counter rebuildFailed;
              private final Counter rebuildRejected;

              public RankingService(RedisRankingRepository rankingRepository, PostRepository postRepository,
                                    RankingFormula formula, MeterRegistry meterRegistry) {
                  this.rankingRepository = rankingRepository;
                  this.postRepository = postRepository;
                  this.formula = formula;
                  this.updates = meterRegistry.counter("vote.ranking.operations", "result", "update");
                  this.rebuilds = meterRegistry.counter("vote.ranking.operations", "result", "rebuild");
                  this.fallbacks = meterRegistry.counter("vote.ranking.operations", "result", "fallback");
                  this.rebuildRequested = meterRegistry.counter("vote.ranking.rebuild", "result", "requested");
                  this.rebuildSucceeded = meterRegistry.counter("vote.ranking.rebuild", "result", "succeeded");
                  this.rebuildFailed = meterRegistry.counter("vote.ranking.rebuild", "result", "failed");
                  this.rebuildRejected = meterRegistry.counter("vote.ranking.rebuild", "result", "rejected");
              }

              public void apply(RankingChangedEvent event) {
                  Instant now = clock.instant();
                  if (event.deleted()) {
                      rankingRepository.remove(event.postId(), now);
                  } else {
                      rankingRepository.upsert(event.postId(), event.voteScore(),
                              formula.score(event.voteScore(), event.createdAt(), now), event.createdAt(), now);
                  }
                  updates.increment();
              }

              public void applyLatest(UUID postId) {
                  Instant now = clock.instant();
                  postRepository.findById(postId).filter(Post::isPubliclyVisible).ifPresentOrElse(
                          post -> rankingRepository.upsert(post.getId(), post.getVoteScore(),
                                  formula.score(post.getVoteScore(), post.getCreatedAt(), now), post.getCreatedAt(), now),
                          () -> rankingRepository.remove(postId, now));
                  updates.increment();
              }

              public Page<Post> list(FeedType feed, Pageable pageable) {
                  return list(feed, pageable, PostFilter.empty());
              }

              public Page<Post> list(FeedType feed, Pageable pageable, PostFilter filter) {
                  if (feed == FeedType.LATEST || feed == FeedType.MINE) return databasePage(pageable, filter);
                  Instant now = clock.instant();
                  try {
                      ensureRankings(feed, now);
                      return filter.isEmpty()
                              ? rankedPage(feed, pageable, now)
                              : filteredRankedPage(feed, pageable, filter, now);
                  } catch (DataAccessException exception) {
                      fallbacks.increment();
                      return databasePage(pageable, filter);
                  }
              }

              public RankingStatusSnapshot status() {
                  Instant now = clock.instant();
                  long visible = postRepository.count(PostSpecifications.publiclyVisible());
                  long day = postRepository.count(PostSpecifications.publiclyVisible().and(rankedWindow(FeedType.TOP_DAY, now)));
                  long week = postRepository.count(PostSpecifications.publiclyVisible().and(rankedWindow(FeedType.TOP_WEEK, now)));
                  try {
                      RedisRankingRepository.RankingCounts counts = rankingRepository.currentCounts(now);
                      RedisRankingRepository.RankingMetadata metadata = rankingRepository.metadata();
                      boolean rebuilding = rankingRepository.isRebuildInProgress();
                      boolean matches = counts.hot() == visible && counts.day() == day && counts.week() == week;
                      boolean currentWindow = !rankingRepository.needsWindowRebuild(now);
                      RankingAvailability availability = rebuilding
                              ? RankingAvailability.REBUILDING
                              : matches && currentWindow ? RankingAvailability.HEALTHY : RankingAvailability.STALE;
                      return new RankingStatusSnapshot(availability, visible, day, week,
                              counts.hot(), counts.day(), counts.week(), metadata.generation(),
                              metadata.publishedAt(), rebuilding);
                  } catch (DataAccessException exception) {
                      return new RankingStatusSnapshot(RankingAvailability.UNAVAILABLE, visible, day, week,
                              null, null, null, null, null, false);
                  }
              }

              public RankingRebuildResult rebuild() {
                  rebuildRequested.increment();
                  String token = UUID.randomUUID().toString();
                  if (!rankingRepository.tryAcquireRebuildLock(token, REBUILD_LOCK_TTL)) {
                      rebuildRejected.increment();
                      throw new ConflictException("A ranking rebuild is already in progress");
                  }

                  RedisRankingRepository.RankingGeneration generation =
                          rankingRepository.createGeneration(UUID.randomUUID().toString());
                  try {
                      Instant now = clock.instant();
                      RedisRankingRepository.RankingCounts previousCounts = rankingRepository.currentCounts(now);
                      List<Post> visiblePosts = postRepository.findAll(PostSpecifications.publiclyVisible());
                      for (Post post : visiblePosts) {
                          rankingRepository.stageUpsert(generation, post.getId(), post.getVoteScore(),
                                  formula.score(post.getVoteScore(), post.getCreatedAt(), now), post.getCreatedAt(), now);
                      }
                      RedisRankingRepository.RankingCounts staged = rankingRepository.generationCounts(generation);
                      long expectedDay = visiblePosts.stream().filter(post -> isSameUtcDay(post.getCreatedAt(), now)).count();
                      long expectedWeek = visiblePosts.stream().filter(post -> isSameUtcWeek(post.getCreatedAt(), now)).count();
                      RedisRankingRepository.RankingCounts expected =
                              new RedisRankingRepository.RankingCounts(visiblePosts.size(), expectedDay, expectedWeek);
                      if (!expected.equals(staged)) {
                          throw new IllegalStateException("Staged ranking generation failed verification");
                      }
                      RedisRankingRepository.PublishState state =
                              rankingRepository.publishGeneration(generation, expected, token, now);
                      return new RankingRebuildResult(token, generation, state, previousCounts, expected,
                              visiblePosts.size(), now);
                  } catch (RuntimeException exception) {
                      rankingRepository.discardGeneration(generation);
                      rankingRepository.releaseRebuildLock(token);
                      rebuildFailed.increment();
                      throw exception;
                  }
              }

              public void completeRebuild(RankingRebuildResult result) {
                  rankingRepository.releaseRebuildLock(result.lockToken());
                  rebuilds.increment();
                  rebuildSucceeded.increment();
              }

              public void rollbackRebuild(RankingRebuildResult result) {
                  try {
                      rankingRepository.rollbackGeneration(result.generation(), result.publishState(),
                              result.lockToken(), clock.instant());
                  } finally {
                      rankingRepository.releaseRebuildLock(result.lockToken());
                      rebuildFailed.increment();
                  }
              }

              private Page<Post> databasePage(Pageable pageable, PostFilter filter) {
                  PageRequest latest = PageRequest.of(pageable.getPageNumber(), pageable.getPageSize(),
                          Sort.by(Sort.Direction.DESC, "createdAt"));
                  return postRepository.findAll(PostSpecifications.matches(filter), latest);
              }

              private Page<Post> rankedPage(FeedType feed, Pageable pageable, Instant now) {
                  Specification<Post> visibleForFeed = PostSpecifications.publiclyVisible().and(rankedWindow(feed, now));
                  long visibleTotal = postRepository.count(visibleForFeed);
                  if (visibleTotal == 0 || pageable.getOffset() >= visibleTotal) {
                      return new PageImpl<>(List.of(), pageable, visibleTotal);
                  }
                  long rawTotal = rankingRepository.count(feed, now);
                  long requestedStart = pageable.getOffset();
                  long requestedEnd = requestedStart + pageable.getPageSize();
                  long visibleIndex = 0;
                  List<Post> content = new ArrayList<>(pageable.getPageSize());
                  outer:
                  for (long rawOffset = 0; rawOffset < rawTotal; rawOffset += FILTER_SCAN_CHUNK_SIZE) {
                      int chunkSize = (int) Math.min(FILTER_SCAN_CHUNK_SIZE, rawTotal - rawOffset);
                      List<UUID> ids = rankingRepository.range(feed, rawOffset, chunkSize, now);
                      if (ids.isEmpty()) break;
                      Map<UUID, Post> visibleById = postRepository.findAll(
                                      visibleForFeed.and(PostSpecifications.idIn(ids))).stream()
                              .collect(Collectors.toMap(Post::getId, Function.identity()));
                      for (UUID id : ids) {
                          Post post = visibleById.get(id);
                          if (post == null) continue;
                          if (visibleIndex >= requestedStart && visibleIndex < requestedEnd) content.add(post);
                          visibleIndex += 1;
                          if (visibleIndex >= requestedEnd) break outer;
                      }
                  }
                  return new PageImpl<>(content, pageable, visibleTotal);
              }

              private Page<Post> filteredRankedPage(FeedType feed, Pageable pageable, PostFilter filter, Instant now) {
                  long rawTotal = rankingRepository.count(feed, now);
                  long requestedStart = pageable.getOffset();
                  long requestedEnd = requestedStart + pageable.getPageSize();
                  long matchedTotal = 0;
                  List<Post> content = new ArrayList<>(pageable.getPageSize());
                  Specification<Post> baseSpecification = PostSpecifications.matches(filter).and(rankedWindow(feed, now));
                  for (long rawOffset = 0; rawOffset < rawTotal; rawOffset += FILTER_SCAN_CHUNK_SIZE) {
                      int chunkSize = (int) Math.min(FILTER_SCAN_CHUNK_SIZE, rawTotal - rawOffset);
                      List<UUID> ids = rankingRepository.range(feed, rawOffset, chunkSize, now);
                      if (ids.isEmpty()) break;
                      Map<UUID, Post> matchesById = postRepository.findAll(
                                      baseSpecification.and(PostSpecifications.idIn(ids))).stream()
                              .collect(Collectors.toMap(Post::getId, Function.identity()));
                      for (UUID id : ids) {
                          Post post = matchesById.get(id);
                          if (post == null) continue;
                          if (matchedTotal >= requestedStart && matchedTotal < requestedEnd) content.add(post);
                          matchedTotal += 1;
                      }
                  }
                  return new PageImpl<>(content, pageable, matchedTotal);
              }

              private void ensureRankings(FeedType feed, Instant now) {
                  boolean missing = rankingRepository.isEmpty(feed, now)
                          && postRepository.count(PostSpecifications.publiclyVisible().and(rankedWindow(feed, now))) > 0;
                  if (!rankingRepository.needsWindowRebuild(now) && !missing) return;
                  try {
                      RankingRebuildResult result = rebuild();
                      completeRebuild(result);
                  } catch (ConflictException ignored) {
                      // Another request is already rebuilding the shared generation.
                  }
              }

              private Specification<Post> rankedWindow(FeedType feed, Instant now) {
                  return switch (feed) {
                      case HOT -> (root, query, criteriaBuilder) -> criteriaBuilder.conjunction();
                      case TOP_DAY -> PostSpecifications.createdAtOnOrAfter(
                              LocalDate.ofInstant(now, ZoneOffset.UTC).atStartOfDay(ZoneOffset.UTC).toInstant());
                      case TOP_WEEK -> PostSpecifications.createdAtOnOrAfter(
                              LocalDate.ofInstant(now, ZoneOffset.UTC)
                                      .with(TemporalAdjusters.previousOrSame(DayOfWeek.MONDAY))
                                      .atStartOfDay(ZoneOffset.UTC).toInstant());
                      case LATEST, MINE -> throw new IllegalArgumentException(feed + " is database-backed");
                  };
              }

              private boolean isSameUtcDay(Instant first, Instant second) {
                  return LocalDate.ofInstant(first, ZoneOffset.UTC).equals(LocalDate.ofInstant(second, ZoneOffset.UTC));
              }

              private boolean isSameUtcWeek(Instant first, Instant second) {
                  LocalDate a = LocalDate.ofInstant(first, ZoneOffset.UTC)
                          .with(TemporalAdjusters.previousOrSame(DayOfWeek.MONDAY));
                  LocalDate b = LocalDate.ofInstant(second, ZoneOffset.UTC)
                          .with(TemporalAdjusters.previousOrSame(DayOfWeek.MONDAY));
                  return a.equals(b);
              }
          }

name: Code map

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/src/**'
      - 'scripts/code_map.py'
      - '.github/workflows/code-map.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'frontend/src/**'
      - 'scripts/code_map.py'
      - '.github/workflows/code-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generator syntax
        run: python -m py_compile scripts/code_map.py
      - name: Generate graph
        run: python scripts/code_map.py --check-minimum
      - name: Validate graph JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          graph = json.loads(Path('build/code-map/graph.json').read_text())
          assert graph['schemaVersion'] == 1
          assert graph['nodes'], 'graph has no nodes'
          assert graph['edges'], 'graph has no edges'
          assert all(edge['confidence'] in {'extracted', 'inferred'} for edge in graph['edges'])
          print(f"validated {len(graph['nodes'])} nodes and {len(graph['edges'])} edges")
          PY
      - name: Upload code map
        uses: actions/upload-artifact@v4
        with:
          name: vote-system-code-map-${{ github.sha }}
          path: build/code-map/
          if-no-files-found: error
          retention-days: 14

name: TON-110 Visibility Race Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ton110-visibility-race-fix.yml'
      - '.chatgpt/ton110/visibility-race-fix.patch.gz.b64'

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact visibility repair
        shell: bash
        run: |
          set -euo pipefail
          base='bfebe1c44c23770f12e32bf300c839efe46f9883'
          encoded='.chatgpt/ton110/visibility-race-fix.patch.gz.b64'
          trimmed="$RUNNER_TEMP/visibility-race-fix.patch.gz.b64"
          patch="$RUNNER_TEMP/visibility-race-fix.patch"

          test "$(wc -c < "$encoded")" -ge 2160
          head -c 2160 "$encoded" > "$trimmed"
          echo '49bafb0462e6d72585182777754db7ad1687b26fa3526ef6c44193bee1af0601  '"$trimmed" | sha256sum --check
          base64 --decode "$trimmed" | gzip --decompress > "$patch"
          echo '8868867be3c429198bc983183dc0ddc09c0e35b55706a7a26181945da4bb8099  '"$patch" | sha256sum --check
          test "${{ github.event.pull_request.base.sha }}" = '65a8b05ab462d80240a7376b081ea81cc20a1fa7'

          git checkout --detach "$base"
          git apply --check "$patch"
          git apply "$patch"
          git diff --check

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile backend
        run: mvn -q -DskipTests compile

      - name: Run isolated visibility regression
        id: regression
        shell: bash
        run: |
          set +e
          rm -rf target/surefire-reports
          mvn -DtrimStackTrace=false \
            -Dtest='CommentIntegrationTests#repositoryCursorQueryCannotExposeCommentsAfterBallotBecomesHidden' \
            test > "$RUNNER_TEMP/ton110-maven-output.txt" 2>&1
          status=$?
          printf '%s' "$status" > "$RUNNER_TEMP/ton110-test-status"
          {
            echo '=== Maven output ==='
            cat "$RUNNER_TEMP/ton110-maven-output.txt"
            echo
            echo '=== Surefire text reports ==='
            find target/surefire-reports -maxdepth 1 -type f -name '*.txt' \
              -print -exec cat {} \; 2>/dev/null || true
            echo
            echo '=== Surefire XML failure/error snippets ==='
            grep -R -n -E '<failure|<error|AssertionFailedError|expected:|actual:' \
              target/surefire-reports 2>/dev/null || true
          } > "$RUNNER_TEMP/ton110-visibility-diagnostics.txt"
          exit 0

      - name: Upload visibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ton110-visibility-diagnostics
          path: |
            ${{ runner.temp }}/ton110-visibility-diagnostics.txt
            ${{ runner.temp }}/ton110-maven-output.txt
            ${{ runner.temp }}/ton110-test-status
            target/surefire-reports/**
          retention-days: 1
          if-no-files-found: error

      - name: Require isolated visibility regression
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat "$RUNNER_TEMP/ton110-test-status")"
          if [ "$status" -ne 0 ]; then
            cat "$RUNNER_TEMP/ton110-visibility-diagnostics.txt"
            exit "$status"
          fi

      - name: Run full comment integration suite
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/surefire-reports
          if ! mvn -q -Dtest=CommentIntegrationTests test; then
            find target/surefire-reports -maxdepth 1 -type f -name '*.txt' \
              -print -exec cat {} \; || true
            exit 1
          fi

      - name: Publish exact repair
        shell: bash
        run: |
          set -euo pipefail
          base='bfebe1c44c23770f12e32bf300c839efe46f9883'
          task_branch='hungtvb2020/ton-110-comments-foundation-replies-ownership-and-pagination'
          python3 - <<'PY'
          import subprocess

          expected = {
              'docs/verification/TON-110-comments-foundation.md',
              'src/main/java/com/hungtvb/votesystem/comment/CommentRepository.java',
              'src/test/java/com/hungtvb/votesystem/comment/CommentIntegrationTests.java',
          }
          tracked = subprocess.check_output(
              ['git', 'diff', '--name-only', 'bfebe1c44c23770f12e32bf300c839efe46f9883'],
              text=True,
          ).splitlines()
          untracked = subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard'],
              text=True,
          ).splitlines()
          paths = set(tracked) | set(untracked)
          if paths != expected:
              raise SystemExit(
                  f'TON-110 repair allowlist mismatch; missing={sorted(expected - paths)}; '
                  f'unexpected={sorted(paths - expected)}'
              )
          PY

          git config user.name 'vote-system-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git commit -m 'TON-110 Prevent hidden-ballot comment disclosure race'
          git push --force-with-lease="refs/heads/$task_branch:$base" \
            origin "HEAD:refs/heads/$task_branch"

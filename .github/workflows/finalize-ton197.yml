name: Finalize TON-197

on:
  push:
    branches:
      - hungtvb2020/ton-197-be-admin-user-and-ballot-search-apis

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hungtvb2020/ton-197-be-admin-user-and-ballot-search-apis
      - name: Complete acceptance tests and docs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise RuntimeError(f"anchor not found: {path}")
              file.write_text(text.replace(old, new, 1))

          test = "src/test/java/com/hungtvb/votesystem/admin/search/AdminSearchIntegrationTests.java"
          replace_once(test,
          '''        mockMvc.perform(get("/api/v1/admin/users/{userId}", alpha.userId())
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken())))
                  .andExpect(status().isOk())
          ''',
          '''        mockMvc.perform(get("/api/v1/admin/users")
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken()))
                          .param("id", alpha.userId().toString()))
                  .andExpect(status().isOk())
                  .andExpect(jsonPath("$.totalElements").value(1))
                  .andExpect(jsonPath("$.content[0].id").value(alpha.userId().toString()));

          mockMvc.perform(get("/api/v1/admin/users")
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken()))
                          .param("query", "admin-search-users-admin")
                          .param("role", "ADMIN"))
                  .andExpect(status().isOk())
                  .andExpect(jsonPath("$.totalElements").value(1))
                  .andExpect(jsonPath("$.content[0].id").value(admin.userId().toString()))
                  .andExpect(jsonPath("$.content[0].role").value("ADMIN"));

          mockMvc.perform(get("/api/v1/admin/users/{userId}", alpha.userId())
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken())))
                  .andExpect(status().isOk())
          ''')

          replace_once(test,
          '''        mockMvc.perform(get("/api/v1/admin/posts/{postId}", deleted.getId())
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken())))
                  .andExpect(status().isOk())
          ''',
          '''        mockMvc.perform(get("/api/v1/admin/posts")
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken()))
                          .param("id", hidden.getId().toString()))
                  .andExpect(status().isOk())
                  .andExpect(jsonPath("$.totalElements").value(1))
                  .andExpect(jsonPath("$.content[0].id").value(hidden.getId().toString()));

          mockMvc.perform(get("/api/v1/admin/posts")
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken()))
                          .param("authorId", author.userId().toString())
                          .param("category", "ADMIN_MOD_SEARCH")
                          .param("size", "100"))
                  .andExpect(status().isOk())
                  .andExpect(jsonPath("$.totalElements").value(2));

          mockMvc.perform(get("/api/v1/admin/posts/{postId}", deleted.getId())
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken())))
                  .andExpect(status().isOk())
          ''')

          readme = Path("README.md")
          text = readme.read_text()
          text = text.replace('- atomic account-state, session-revocation, and audit transactions.\n', '- atomic account-state, session-revocation, and audit transactions;\n- protected paginated administrator search for users and ballots with privacy-safe DTOs and fixed deterministic ordering.\n')
          text = text.replace('GET    /api/v1/admin/audit-logs\n', 'GET    /api/v1/admin/audit-logs\nGET    /api/v1/admin/users\nGET    /api/v1/admin/users/{userId}\nGET    /api/v1/admin/posts\nGET    /api/v1/admin/posts/{postId}\n')
          text = text.replace('- [`docs/ADMIN.md`](docs/ADMIN.md) — authorization, bootstrap, audit, and admin mutations.\n', '- [`docs/ADMIN.md`](docs/ADMIN.md) — authorization, bootstrap, audit, and admin mutations.\n- [`docs/ADMIN-SEARCH.md`](docs/ADMIN-SEARCH.md) — protected user/ballot search, privacy, pagination, and query boundaries.\n')
          text = text.replace('''```text
TON-195  Audited ballot moderation and visibility enforcement
   ↓
TON-196  User suspension, banning, and access enforcement
   ↓
TON-197  Admin user and ballot search APIs
TON-198  Audited atomic ranking rebuild
   ↓
TON-199  Protected admin moderation workspace
   ↓
TON-140  Unified reports and moderation cases
```''', '''```text
Completed  TON-195  Audited ballot moderation and visibility enforcement
Completed  TON-196  User suspension, banning, and access enforcement
           ↓
TON-197  Admin user and ballot search APIs
TON-198  Audited atomic ranking rebuild
   ↓
TON-199  Protected admin moderation workspace
   ↓
TON-140  Unified reports and moderation cases
```''')
          readme.write_text(text)

          index = Path("docs/README.md")
          text = index.read_text()
          text = text.replace('TON-194  Immutable admin audit log foundation\n', 'TON-194  Immutable admin audit log foundation\nTON-195  Audited ballot moderation and visibility enforcement\nTON-196  User suspension, banning, and access enforcement\n')
          text = text.replace('''TON-109  Admin roles, audit log, moderation, and operational dashboard
  TON-195  Audited ballot moderation and visibility enforcement
     ↓
  TON-196  User suspension, banning, and access enforcement
     ↓
  TON-197  Admin user and ballot search APIs
     ↓
  TON-198  Audited atomic ranking rebuild
''', '''TON-109  Admin roles, audit log, moderation, and operational dashboard
  TON-197  Admin user and ballot search APIs
     ↓
  TON-198  Audited atomic ranking rebuild
''')
          index.write_text(text)

          api = Path("docs/API.md")
          text = api.read_text()
          if '## Administrator search APIs\n' not in text:
              section = '''## Administrator search APIs

Protected read APIs for the moderation workspace:

```http
GET /api/v1/admin/users
GET /api/v1/admin/users/{userId}
GET /api/v1/admin/posts
GET /api/v1/admin/posts/{postId}
Authorization: Bearer <admin access token>
```

User filters are exact ID, case-insensitive email/display-name query, role, effective account status, and inclusive created-at range. Ballot filters are exact ID, ballot number, case-insensitive title/content query, author, category, lifecycle status, moderation status, and inclusive created-at range.

List responses use an explicit page DTO, zero-based pages, default size 20, maximum size 100, and fixed `createdAt DESC, id DESC` ordering. Text filters escape SQL LIKE wildcards. Hidden and deleted ballots are available only through the protected administrator path.

User responses exclude credential, provider-subject, session/token, IP, and raw user-agent fields. Ballot responses exclude individual voter identities and vote rows. Provider and author context is batch-loaded to avoid N+1 queries. See [`ADMIN-SEARCH.md`](ADMIN-SEARCH.md).

'''
              text = text.replace('## Rate limiting\n', section + '## Rate limiting\n', 1)
          api.write_text(text)

          admin = Path("docs/ADMIN.md")
          text = admin.read_text()
          if '## Administrator read workspace APIs\n' not in text:
              section = '''## Administrator read workspace APIs

TON-197 adds privacy-bounded user and ballot search/detail endpoints under `/api/v1/admin/**`. Dedicated administrator repositories are not reused by public profile/feed paths, so hidden/deleted moderation visibility remains isolated.

Responses use explicit deterministic page DTOs. User results may include operational email, role, effective account status, provider names, and safe timestamps, but never credentials, provider subjects, session/token material, IP addresses, or raw user agents. Ballot results may include moderation state and aggregate vote data, but never individual voter identities.

Text filters are bounded and escape SQL LIKE wildcards. Provider and author context is batch-loaded, and integration tests enforce a constant statement-count ceiling. Full contract: [`ADMIN-SEARCH.md`](ADMIN-SEARCH.md).

'''
              text = text.replace('## Verification\n', section + '## Verification\n', 1)
          text = text.replace('- rollback of account state and session revocation when audit validation fails.\n', '- rollback of account state and session revocation when audit validation fails;\n- administrator user/ballot filters, privacy-field absence, deterministic pagination, hidden/deleted visibility, and constant query counts.\n')
          admin.write_text(text)
      - name: Commit completed TON-197
        shell: bash
        run: |
          rm .github/workflows/finalize-ton197.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(docs): complete TON-197 acceptance coverage"
          git push origin HEAD:hungtvb2020/ton-197-be-admin-user-and-ballot-search-apis

name: Finalize TON-197

on:
  push:
    branches:
      - hungtvb2020/ton-197-be-admin-user-and-ballot-search-apis
    paths:
      - .github/workflows/finalize-ton197.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hungtvb2020/ton-197-be-admin-user-and-ballot-search-apis
      - name: Complete tests and documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          test_path = "src/test/java/com/hungtvb/votesystem/admin/search/AdminSearchIntegrationTests.java"
          user_anchor = '''        mockMvc.perform(get("/api/v1/admin/users/{userId}", alpha.userId())
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken())))
                  .andExpect(status().isOk())
          '''
          user_insert = '''        mockMvc.perform(get("/api/v1/admin/users")
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken()))
                          .param("id", alpha.userId().toString()))
                  .andExpect(status().isOk())
                  .andExpect(jsonPath("$.totalElements").value(1))
                  .andExpect(jsonPath("$.content[0].id").value(alpha.userId().toString()));

          mockMvc.perform(get("/api/v1/admin/users")
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken()))
                          .param("query", "admin-search-users-admin")
                          .param("role", "ADMIN"))
                  .andExpect(status().isOk())
                  .andExpect(jsonPath("$.totalElements").value(1))
                  .andExpect(jsonPath("$.content[0].id").value(admin.userId().toString()))
                  .andExpect(jsonPath("$.content[0].role").value("ADMIN"));

          mockMvc.perform(get("/api/v1/admin/users/{userId}", alpha.userId())
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken())))
                  .andExpect(status().isOk())
          '''
          replace_once(test_path, user_anchor, user_insert)

          post_anchor = '''        mockMvc.perform(get("/api/v1/admin/posts/{postId}", deleted.getId())
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken())))
                  .andExpect(status().isOk())
          '''
          post_insert = '''        mockMvc.perform(get("/api/v1/admin/posts")
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken()))
                          .param("id", hidden.getId().toString()))
                  .andExpect(status().isOk())
                  .andExpect(jsonPath("$.totalElements").value(1))
                  .andExpect(jsonPath("$.content[0].id").value(hidden.getId().toString()));

          mockMvc.perform(get("/api/v1/admin/posts")
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken()))
                          .param("authorId", author.userId().toString())
                          .param("category", "ADMIN_MOD_SEARCH")
                          .param("size", "100"))
                  .andExpect(status().isOk())
                  .andExpect(jsonPath("$.totalElements").value(2));

          mockMvc.perform(get("/api/v1/admin/posts/{postId}", deleted.getId())
                          .header(HttpHeaders.AUTHORIZATION, bearer(admin.accessToken())))
                  .andExpect(status().isOk())
          '''
          replace_once(test_path, post_anchor, post_insert)

          readme = Path("README.md")
          text = readme.read_text()
          text = text.replace(
              '- atomic account-state, session-revocation, and audit transactions.\n',
              '- atomic account-state, session-revocation, and audit transactions;\n'
              '- protected paginated administrator search for users and ballots with privacy-safe DTOs and fixed deterministic ordering.\n'
          )
          text = text.replace(
              'GET    /api/v1/admin/audit-logs\n',
              'GET    /api/v1/admin/audit-logs\n'
              'GET    /api/v1/admin/users\n'
              'GET    /api/v1/admin/users/{userId}\n'
              'GET    /api/v1/admin/posts\n'
              'GET    /api/v1/admin/posts/{postId}\n'
          )
          text = text.replace(
              '- [`docs/ADMIN.md`](docs/ADMIN.md) — authorization, bootstrap, audit, and admin mutations.\n',
              '- [`docs/ADMIN.md`](docs/ADMIN.md) — authorization, bootstrap, audit, and admin mutations.\n'
              '- [`docs/ADMIN-SEARCH.md`](docs/ADMIN-SEARCH.md) — protected user/ballot search, privacy, pagination, and query boundaries.\n'
          )
          old_roadmap = '''```text
          TON-195  Audited ballot moderation and visibility enforcement
             ↓
          TON-196  User suspension, banning, and access enforcement
             ↓
          TON-197  Admin user and ballot search APIs
          TON-198  Audited atomic ranking rebuild
             ↓
          TON-199  Protected admin moderation workspace
             ↓
          TON-140  Unified reports and moderation cases
          ```'''
          new_roadmap = '''```text
          Completed  TON-195  Audited ballot moderation and visibility enforcement
          Completed  TON-196  User suspension, banning, and access enforcement
                     ↓
          TON-197  Admin user and ballot search APIs
          TON-198  Audited atomic ranking rebuild
             ↓
          TON-199  Protected admin moderation workspace
             ↓
          TON-140  Unified reports and moderation cases
          ```'''
          if old_roadmap not in text:
              raise SystemExit("README roadmap anchor not found")
          readme.write_text(text.replace(old_roadmap, new_roadmap, 1))

          docs_index = Path("docs/README.md")
          text = docs_index.read_text()
          text = text.replace(
              'TON-194  Immutable admin audit log foundation\n',
              'TON-194  Immutable admin audit log foundation\n'
              'TON-195  Audited ballot moderation and visibility enforcement\n'
              'TON-196  User suspension, banning, and access enforcement\n'
          )
          old_sequence = '''TON-109  Admin roles, audit log, moderation, and operational dashboard
            TON-195  Audited ballot moderation and visibility enforcement
               ↓
            TON-196  User suspension, banning, and access enforcement
               ↓
            TON-197  Admin user and ballot search APIs
               ↓
            TON-198  Audited atomic ranking rebuild
          '''
          new_sequence = '''TON-109  Admin roles, audit log, moderation, and operational dashboard
            TON-197  Admin user and ballot search APIs
               ↓
            TON-198  Audited atomic ranking rebuild
          '''
          if old_sequence not in text:
              raise SystemExit("docs README sequence anchor not found")
          docs_index.write_text(text.replace(old_sequence, new_sequence, 1))

          api = Path("docs/API.md")
          text = api.read_text()
          section = '''## Administrator search APIs

          Protected read APIs for the moderation workspace:

          ```http
          GET /api/v1/admin/users
          GET /api/v1/admin/users/{userId}
          GET /api/v1/admin/posts
          GET /api/v1/admin/posts/{postId}
          Authorization: Bearer <admin access token>
          ```

          User-list filters are exact `id`, case-insensitive email/display-name `query`, `role`, effective `accountStatus`, and inclusive created-at range. Ballot-list filters are exact `id`, ballot number, case-insensitive title/content `query`, `authorId`, category, lifecycle status, moderation status, and inclusive created-at range.

          List responses use an explicit page DTO with zero-based pages, default size 20, maximum size 100, and fixed `createdAt DESC, id DESC` ordering. Text filters escape SQL LIKE wildcards. Hidden and deleted ballots are returned only through the protected admin path.

          User responses include operational email, role, effective account status, restriction expiry, provider names, and safe timestamps. They exclude password hashes, provider subjects/email payloads, sessions, tokens, IP addresses, and raw user agents. Ballot responses exclude individual voter identities and vote rows. Provider and author context is batch-loaded to avoid N+1 queries. See [`ADMIN-SEARCH.md`](ADMIN-SEARCH.md).

          '''
          anchor = '## Rate limiting\n'
          if '## Administrator search APIs\n' not in text:
              if anchor not in text:
                  raise SystemExit("API insertion anchor not found")
              text = text.replace(anchor, section + anchor, 1)
          api.write_text(text)

          admin = Path("docs/ADMIN.md")
          text = admin.read_text()
          section = '''## Administrator read workspace APIs

          TON-197 adds read-only user and ballot search/detail endpoints under `/api/v1/admin/**`. These use dedicated administrator repositories rather than public profile/feed repositories, preventing unrestricted moderation visibility from leaking into public paths.

          Responses are explicit privacy-bounded DTOs with deterministic pagination. User results may include operational email, role, effective account status, provider names, and safe timestamps, but never credentials, provider subjects, session/token material, IP addresses, or raw user agents. Ballot results may include hidden/deleted state and aggregate vote data, but never individual voter identities.

          Query text is bounded and SQL LIKE wildcards are escaped. Provider and author context is batch-loaded, with integration tests enforcing a constant statement-count ceiling. Full contract: [`ADMIN-SEARCH.md`](ADMIN-SEARCH.md).

          '''
          anchor = '## Verification\n'
          if '## Administrator read workspace APIs\n' not in text:
              if anchor not in text:
                  raise SystemExit("ADMIN insertion anchor not found")
              text = text.replace(anchor, section + anchor, 1)
          text = text.replace(
              '- rollback of account state and session revocation when audit validation fails.\n',
              '- rollback of account state and session revocation when audit validation fails;\n'
              '- administrator user/ballot filters, privacy-field absence, deterministic pagination, hidden/deleted visibility, and constant query counts.\n'
          )
          admin.write_text(text)
          PY

          rm .github/workflows/finalize-ton197.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(docs): complete TON-197 acceptance coverage"
          git push origin HEAD:hungtvb2020/ton-197-be-admin-user-and-ballot-search-apis

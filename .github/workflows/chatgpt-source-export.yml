name: ChatGPT Source Export

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/chatgpt-source-export.yml'

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact PR base commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach '${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.base.sha }}'
          git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Package exact source snapshot with Git history
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/vote-system-main-with-git.tar.gz"
          checksum="$archive.sha256"
          tar --exclude='.github/workflows/chatgpt-source-export.yml' -czf "$archive" .
          sha256sum "$archive" > "$checksum"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: vote-system-main-with-git
          path: |
            ${{ runner.temp }}/vote-system-main-with-git.tar.gz
            ${{ runner.temp }}/vote-system-main-with-git.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

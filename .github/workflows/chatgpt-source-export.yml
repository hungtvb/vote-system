name: ChatGPT Source Export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package source snapshot
        shell: bash
        run: |
          archive="$RUNNER_TEMP/vote-system-source.tar.gz"
          checksum="$RUNNER_TEMP/vote-system-source.tar.gz.sha256"
          tar --exclude=.git -czf "$archive" .
          test -s "$archive"
          sha256sum "$archive" | sed "s#${RUNNER_TEMP}/##" > "$checksum"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: vote-system-source
          path: |
            ${{ runner.temp }}/vote-system-source.tar.gz
            ${{ runner.temp }}/vote-system-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

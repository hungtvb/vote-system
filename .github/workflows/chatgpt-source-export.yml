name: ChatGPT Source Export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Package full Git working copy
        shell: bash
        run: |
          archive="$RUNNER_TEMP/vote-system-main-with-git.tar.gz"
          checksum="$RUNNER_TEMP/vote-system-main-with-git.tar.gz.sha256"
          tar -czf "$archive" .
          test -s "$archive"
          sha256sum "$archive" | sed "s#${RUNNER_TEMP}/##" > "$checksum"

      - name: Upload full Git working copy
        uses: actions/upload-artifact@v4
        with:
          name: vote-system-main-with-git
          path: |
            ${{ runner.temp }}/vote-system-main-with-git.tar.gz
            ${{ runner.temp }}/vote-system-main-with-git.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

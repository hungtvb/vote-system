name: TON-251 Dependency Publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ton251-dependency-publisher.yml

permissions:
  contents: write

jobs:
  update-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate dependency lock
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact next@16.3.0
          node <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages ?? {};
          const expected = {
            'node_modules/next': '16.3.0',
            'node_modules/postcss': '8.5.23',
            'node_modules/sharp': '0.35.3',
          };
          for (const [path, version] of Object.entries(expected)) {
            const actual = packages[path]?.version;
            if (actual !== version) {
              throw new Error(`${path}: expected ${version}, got ${actual ?? 'missing'}`);
            }
          }
          NODE

      - name: Install exact lock
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Publish verified dependency files
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/ton251-dependency-publisher.yml
          git add frontend/package.json frontend/package-lock.json

          mapfile -t changed < <(git diff --cached --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/ton251-dependency-publisher.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx 'frontend/package-lock.json'
          printf '%s\n' "${changed[@]}" | grep -Fx 'frontend/package.json'

          git config user.name 'vote-system-automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'TON-251 Upgrade Next.js and remediate OSV advisories'
          git push origin "HEAD:${BRANCH}"
